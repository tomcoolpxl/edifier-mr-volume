name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs this first, on the commit being released.
  workflow_call:
    inputs:
      ref:
        description: 'Commit, branch or tag to check (default: the triggering ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Third-party actions are pinned to a commit, with the version it was in a comment.
jobs:
  build-test:
    name: Build, test and smoke-launch
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Protocol tests
        run: dotnet test tests/EdifierMrVolume.Core.Tests -c Release --logger trx --results-directory TestResults

      - name: Build the app (x64)
        run: dotnet build src/EdifierMrVolume/EdifierMrVolume.csproj -c Release -p:Platform=x64

      # Starts the real WinUI app with --render-icons: it boots XAML, draws the tray icon for
      # a few values and exits. Catches a broken build output or a crash at start-up.
      - name: Smoke-launch the app
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src/EdifierMrVolume/bin/x64/Release/*/win-x64/EdifierMrVolume.exe'
          $out = Join-Path $env:RUNNER_TEMP 'icons'
          $p = Start-Process -FilePath $exe -ArgumentList '--render-icons', $out -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error 'The app did not exit within 60 s.'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "The app exited with $($p.ExitCode)."; exit 1 }
          if (-not (Test-Path (Join-Path $out 'sheet.png'))) { Write-Error 'The app wrote no icon sheet.'; exit 1 }
          Write-Host 'The app started, drew its tray icons and exited.'

      # Inno Setup 6 normally comes with the Windows runner image; install it if not.
      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build the zip and the installer
        shell: pwsh
        run: ./tools/package.ps1

      # What ships is the Native AOT build (PublishAot): no .NET runtime next to it. Start that
      # one too, since a working JIT build says nothing about the AOT one.
      - name: Smoke-launch the published Native AOT app
        shell: pwsh
        run: |
          $dir = 'artifacts/publish/win-x64'
          if (Test-Path (Join-Path $dir 'coreclr.dll')) { Write-Error 'The published app ships the .NET runtime, so it is not the Native AOT build.'; exit 1 }
          $exe = Join-Path $dir 'EdifierMrVolume.exe'
          $out = Join-Path $env:RUNNER_TEMP 'icons-aot'
          $p = Start-Process -FilePath $exe -ArgumentList '--render-icons', $out -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error 'The AOT app did not exit within 60 s.'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "The AOT app exited with $($p.ExitCode)."; exit 1 }
          if (-not (Test-Path (Join-Path $out 'sheet.png'))) { Write-Error 'The AOT app wrote no icon sheet.'; exit 1 }
          Write-Host ('The Native AOT app started, drew its tray icons and exited ({0:N0} MB published).' -f ((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB))

      # The installer on a machine that never had the app: silent install into a temp
      # folder (no autostart, no launch), check the files, silent uninstall, check it's gone.
      - name: Install and uninstall the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts -Filter '*-setup.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'emv-install'
          $log = Join-Path $env:RUNNER_TEMP 'emv-setup.log'
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList `
            "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOLAUNCH /TASKS=`"`" /DIR=`"$dir`" /LOG=`"$log`""
          Get-Content $log | Select-Object -Last 8
          if ($p.ExitCode -ne 0) { Write-Error "Setup exited $($p.ExitCode)."; exit 1 }
          foreach ($f in 'EdifierMrVolume.exe', 'Assets\app-icon.svg', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Error "Missing after install: $f"; exit 1 }
          }
          $u = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru `
            -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          Start-Sleep -Seconds 3
          if ($u.ExitCode -ne 0) { Write-Error "Uninstall exited $($u.ExitCode)."; exit 1 }
          if (Test-Path (Join-Path $dir 'EdifierMrVolume.exe')) { Write-Error 'Uninstall left the app behind.'; exit 1 }
          Write-Host 'Installed, checked and uninstalled.'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
