name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Leave empty when the run is started from the tag itself.'
        required: false
        default: ''

# Read-only, except for the one job that publishes the release.
permissions:
  contents: read

jobs:
  # Gate: CI on the commit being released.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: Build and publish the release
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history and tags, for the release notes.
          fetch-depth: 0
          persist-credentials: false

      # The tag reaches the script through the environment, never pasted into it, and must
      # look like a release tag before anything else uses it.
      - name: Determine the release tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Not a release tag: '$tag'. Start the run from a tag, or name one."
            exit 1
          }
          $prerelease = if ($tag.Contains('-')) { 'true' } else { 'false' }
          Write-Host "Release tag: $tag (pre-release: $prerelease)"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check the tag matches the version in Directory.Build.props
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1
          $tagBase = (($env:TAG -replace '^v', '') -split '-')[0]
          if ($tagBase -ne $version) {
            Write-Error "Tag $env:TAG does not match <Version>$version</Version> in Directory.Build.props."
            exit 1
          }
          Write-Host "Tag $env:TAG matches version $version."

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Self-contained: .NET and the Windows App SDK runtime travel with the exe.
      - name: Publish the app
        run: >-
          dotnet publish src/EdifierMrVolume/EdifierMrVolume.csproj
          -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish

      - name: Package the zip and its checksum
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $zip = "edifier-mr-volume-$env:TAG-win-x64.zip"
          Copy-Item README.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          Write-Host "Archive: $zip ($([math]::Round((Get-Item $zip).Length / 1MB)) MB)"
          Write-Host "SHA256:  $hash"

      - name: Write the release notes
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ./.github/scripts/release-notes.ps1 -Tag $env:TAG -Out release-notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Edifier MR Volume ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          # Appends GitHub's own list of merged pull requests and the full-changelog link.
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: |
            edifier-mr-volume-*-win-x64.zip
            edifier-mr-volume-*-win-x64.zip.sha256
