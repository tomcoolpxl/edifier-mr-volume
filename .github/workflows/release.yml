name: Release

# Two ways in:
#  - Actions › Release › Run workflow, pick patch/minor/major: the version goes up one, the
#    changelog entry is written, "chore(release): X.Y.Z" is committed to main and tagged,
#    then the release is built and published. Nothing to do locally.
#  - Pushing a vX.Y.Z tag yourself: builds and publishes that tag (no bump, no changelog).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version goes up one: patch (fixes), minor (features), major (breaking)'
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Read-only, except for the jobs that commit, tag and publish.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Gate: CI on the commit being released (for "Run workflow": the commit main was at).
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  prepare:
    name: Bump the version and tag
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
      issues: read
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run the release from main, not ${{ github.ref_name }}."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history and tags, for the changelog; credentials kept for the push below.
          fetch-depth: 0

      - name: Raise the version and write the changelog entry
        id: bump
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (./.github/scripts/prepare-release.ps1 -Part $env:BUMP | Select-Object -Last 1)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          git --no-pager diff --stat

      # Pushed with the workflow's own token, so this tag doesn't start the tag-push path of
      # this workflow a second time; the release job below publishes it.
      - name: Commit, tag and push
        shell: pwsh
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          $version = $env:TAG -replace '^v', ''
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): $version"
          git tag -a $env:TAG -m "Edifier MR Volume $version"
          # Fails, and so stops the release, if main moved on since the run started.
          git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin $env:TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    name: Build and publish the release
    needs: [ci, prepare]
    if: >-
      always() && needs.ci.result == 'success' &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: windows-latest
    permissions:
      contents: write
      issues: read
    steps:
      # The tag reaches the scripts through the environment, never pasted into them, and must
      # look like a release tag before anything else uses it.
      - name: Determine the release tag
        id: tag
        shell: pwsh
        env:
          PREPARED_TAG: ${{ needs.prepare.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:PREPARED_TAG) { $env:PREPARED_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Not a release tag: '$tag'."
            exit 1
          }
          $prerelease = if ($tag.Contains('-')) { 'true' } else { 'false' }
          Write-Host "Release tag: $tag (pre-release: $prerelease)"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Also checks that the tag matches <Version> in Directory.Build.props. ARM64 is
      # cross-compiled on this x64 runner; the CI gate started and installed it on Windows on Arm.
      - name: Build the zips, the installers and their checksums (x64 and ARM64)
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ./tools/package.ps1 -Tag $env:TAG -Platform x64
          ./tools/package.ps1 -Tag $env:TAG -Platform ARM64

      - name: Write the release notes
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/release-notes.ps1 -Tag $env:TAG -Out release-notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Edifier MR Volume ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          # Appends GitHub's own list of merged pull requests and the full-changelog link.
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: |
            artifacts/edifier-mr-volume-*-win-x64.zip
            artifacts/edifier-mr-volume-*-win-x64.zip.sha256
            artifacts/edifier-mr-volume-*-win-x64-setup.exe
            artifacts/edifier-mr-volume-*-win-x64-setup.exe.sha256
            artifacts/edifier-mr-volume-*-win-arm64.zip
            artifacts/edifier-mr-volume-*-win-arm64.zip.sha256
            artifacts/edifier-mr-volume-*-win-arm64-setup.exe
            artifacts/edifier-mr-volume-*-win-arm64-setup.exe.sha256
